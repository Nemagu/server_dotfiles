# ── Prefix Key ──────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General Settings ─────────────────────
set -g mouse on
set-window-option -g mode-keys vi
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g pane-border-lines "double"
set -s escape-time 10

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# ── TPM Plugin Manager ───────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# ── Terminal Colors ──────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# ── Plugins (optional on first launch) ─────
if-shell 'test -f "$HOME/.config/tmux/plugins/tpm/tpm"' 'run-shell "$HOME/.config/tmux/plugins/tpm/tpm"'

# ── Remote clipboard (OSC 52) ──────────────
set -s set-clipboard on
set -as terminal-features ',xterm*:RGB,kitty:RGB,alacritty:RGB'

# ── Catppuccin Frappé ─────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 0
set -g status-right-length 80
set -g status-left ""
set -g status-style 'bg=#292c3c,fg=#c6d0f5'
set -g status-right '#[bg=#8caaee,fg=#303446,bold] #S #[bg=#414559,fg=#c6d0f5] #h '
set -gw window-status-format '#[bg=#414559,fg=#a5adce] #I:#W '
set -gw window-status-current-format '#[bg=#8caaee,fg=#303446,bold] #I:#W '
set -gw window-status-activity-style 'fg=#e5c890'
set -gw window-status-bell-style 'fg=#e78284,bold'
set -g pane-border-style 'fg=#51576d'
set -g pane-active-border-style 'fg=#8caaee'
set -g mode-style 'bg=#51576d,fg=#c6d0f5'
set -g message-style 'bg=#414559,fg=#c6d0f5'
set -g message-command-style 'bg=#414559,fg=#c6d0f5'
set -g clock-mode-colour '#8caaee'
